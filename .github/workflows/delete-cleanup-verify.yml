name: Capture deletion analyzer output

on:
  push:
    branches:
      - fix/delete-cleanup-orphans

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/delete-cleanup-orphans
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture analyzer output
        run: flutter analyze > analyzer-output.txt 2>&1 || true
      - name: Save diagnostic and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/delete-cleanup-verify.yml tool/delete_cleanup_verify_patch.py
          git add analyzer-output.txt
          git commit -m "chore: save analyzer output"
          git push origin HEAD:fix/delete-cleanup-orphans
