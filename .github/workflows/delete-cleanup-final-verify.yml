name: Final deletion cleanup verification

on:
  push:
    branches:
      - fix/delete-cleanup-orphans

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/delete-cleanup-orphans
          fetch-depth: 0
      - name: Apply final join-request rule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('firestore.rules')
          text = p.read_text()
          old = """    match /{path=**}/joinRequests/{uid} {
              allow list: if linkedCommunityAccount()
                && resource.data.userId == request.auth.uid;
            }
          """
          new = """    match /{path=**}/joinRequests/{uid} {
              allow list: if signedIn()
                && resource.data.userId == request.auth.uid;
            }
          """
          if old not in text:
              raise SystemExit('Expected joinRequests collection-group rule not found')
          p.write_text(text.replace(old, new, 1))
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Format changed Dart files
        run: dart format lib/repositories/gub_deletion_repository.dart lib/modules/profile/repositories/account_deletion_repository.dart lib/modules/community/repositories/community_repository.dart test/services/deletion_cleanup_manifest_test.dart
      - name: Run Flutter tests
        run: flutter test
      - name: Analyze changed Dart files
        run: |
          dart analyze lib/repositories/gub_deletion_repository.dart
          dart analyze lib/modules/profile/repositories/account_deletion_repository.dart
          dart analyze lib/modules/community/repositories/community_repository.dart
          dart analyze test/services/deletion_cleanup_manifest_test.dart
      - name: Check full analyzer has no errors
        run: flutter analyze --no-fatal-warnings
      - name: Validate Firestore indexes JSON
        run: python -m json.tool firestore.indexes.json > /dev/null
      - name: Compile Firestore rules in emulator
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-gubify "echo rules-compiled"
      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/delete-cleanup-final-verify.yml analyzer-output.txt
          git add firestore.rules firestore.indexes.json lib/repositories/gub_deletion_repository.dart lib/modules/profile/repositories/account_deletion_repository.dart lib/modules/community/repositories/community_repository.dart test/services/deletion_cleanup_manifest_test.dart
          git commit -m "fix: finalize verified deletion cleanup"
          git push origin HEAD:fix/delete-cleanup-orphans
