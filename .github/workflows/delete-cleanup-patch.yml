name: Apply deletion cleanup patch

on:
  push:
    branches:
      - fix/delete-cleanup-orphans

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/delete-cleanup-orphans
          fetch-depth: 0
      - name: Apply patch
        run: python tool/delete_cleanup_patch.py
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/delete-cleanup-patch.yml tool/delete_cleanup_patch.py
          git add firestore.rules lib/modules/profile/repositories/account_deletion_repository.dart lib/modules/community/repositories/community_repository.dart
          git commit -m "fix: complete deletion cleanup coverage"
          git push origin HEAD:fix/delete-cleanup-orphans
